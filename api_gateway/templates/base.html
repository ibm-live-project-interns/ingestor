{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Subject}}</title>
    <style>
        /* IBM Carbon Design System inspired email styles */
        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            color: #161616;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 560px;
            margin: 0 auto;
            background: #ffffff;
        }
        .header {
            background: #161616;
            padding: 24px 32px;
        }
        .header h1 {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.32px;
        }
        .content {
            padding: 32px;
        }
        .content h2 {
            font-size: 20px;
            font-weight: 400;
            margin: 0 0 16px 0;
            color: #161616;
        }
        .content p {
            font-size: 14px;
            color: #525252;
            margin: 0 0 16px 0;
        }
        .button {
            display: inline-block;
            background: #0f62fe;
            color: #ffffff;
            font-size: 14px;
            font-weight: 400;
            padding: 14px 16px;
            text-decoration: none;
            margin: 16px 0;
        }
        .button:hover {
            background: #0353e9;
        }
        .link-text {
            font-size: 12px;
            color: #525252;
            word-break: break-all;
            background: #f4f4f4;
            padding: 12px;
            margin: 16px 0;
        }
        .link-text a {
            color: #0f62fe;
            text-decoration: none;
        }
        .notice {
            font-size: 12px;
            color: #6f6f6f;
            border-left: 2px solid #e0e0e0;
            padding-left: 12px;
            margin: 24px 0;
        }
        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 24px 0;
        }
        .features {
            margin: 24px 0;
        }
        .feature {
            font-size: 14px;
            color: #525252;
            padding: 8px 0;
            padding-left: 16px;
            border-left: 2px solid #0f62fe;
            margin-bottom: 12px;
        }
        .footer {
            padding: 24px 32px;
            border-top: 1px solid #e0e0e0;
        }
        .footer p {
            font-size: 12px;
            color: #6f6f6f;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{if .AppName}}{{.AppName}}{{else}}Sentrix{{end}}</h1>
        </div>
        <div class="content">
            {{template "content" .}}
        </div>
        <div class="footer">
            <p>&copy; {{if .Year}}{{.Year}}{{else}}2026{{end}} {{if .AppName}}{{.AppName}}{{else}}Sentrix{{end}}</p>
        </div>
    </div>
</body>
</html>
{{end}}
